name: iOS Simulator .app Build & E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios-app:
    name: Build MsngrApp.app (iOS Simulator) & Run Offline Tests
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Run Swift Package Unit & Offline E2E Tests
        run: swift test --parallel

      - name: Install XcodeGen (if not already present)
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate Xcode Project (Msngr.xcodeproj)
        run: xcodegen generate

      - name: Build Universal iOS Simulator Bundle (MsngrApp.app)
        run: |
          xcodebuild build \
            -project Msngr.xcodeproj \
            -scheme MsngrApp \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package MsngrApp.app for Appetize.io & iOS Simulator
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphonesimulator/MsngrApp.app"
          ls -la "$APP_PATH"
          mkdir -p dist
          cp -R "$APP_PATH" dist/MsngrApp.app
          cd dist
          ditto -c -k --sequesterRsrc --keepParent MsngrApp.app MsngrApp-iOS-Simulator.zip
          ls -lh MsngrApp-iOS-Simulator.zip

      - name: Upload MsngrApp.app (.zip for Appetize.io / Simulator)
        uses: actions/upload-artifact@v4
        with:
          name: MsngrApp-iOS-Simulator-App
          path: dist/MsngrApp-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 30
